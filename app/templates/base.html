<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Absolute Story Manager v4.0{% endblock %}</title>
    
    <!-- Tailwind CSS (local) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#6366f1',
                        secondary: '#8b5cf6',
                        accent: '#ec4899',
                        dark: {
                            900: '#0f172a',
                            800: '#1e293b',
                            700: '#334155',
                            600: '#475569'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@latest/css/materialdesignicons.min.css">
    
    <style>
        [x-cloak] { display: none !important; }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
        
        /* Smooth transitions */
        .transition-all { transition-property: all; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); transition-duration: 200ms; }
        
        /* Card hover effects */
        .card-hover { transition: transform 0.2s, box-shadow 0.2s; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        
        /* Gradient backgrounds */
        .gradient-primary { background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%); }
        .gradient-accent { background: linear-gradient(135deg, #ec4899 0%, #f43f5e 100%); }
        
        /* Glass effect */
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); }
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen" x-data="appData()">
    <div class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside :class="sidebarCollapsed ? 'w-20' : 'w-64'" 
               class="bg-dark-800 border-r border-dark-700 flex-shrink-0 transition-all duration-300 flex flex-col">
            <!-- Logo -->
            <div class="p-4 border-b border-dark-700">
                <div class="flex items-center justify-between">
                    <h1 class="text-xl font-bold gradient-primary bg-clip-text text-transparent whitespace-nowrap overflow-hidden"
                        :class="sidebarCollapsed ? 'opacity-0 w-0' : 'opacity-100'">
                        <i class="mdi mdi-book-open-page-variant mr-2"></i>ASM v4.0
                    </h1>
                    <button @click="toggleSidebar()" class="p-2 hover:bg-dark-700 rounded-lg transition-colors">
                        <i class="mdi mdi-menu"></i>
                    </button>
                </div>
            </div>
            
            <!-- Navigation -->
            <nav class="flex-1 overflow-y-auto p-4 space-y-2">
                <a href="/dashboard" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'dashboard' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-view-dashboard text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Dashboard</span>
                </a>
                
                <a href="/chapters" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'chapters' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-file-document-outline text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Bölümler</span>
                </a>
                
                <a href="/characters" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'characters' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-account-group text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Karakterler</span>
                </a>
                
                <a href="/kanban" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'kanban' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-kanban text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Kanban</span>
                </a>
                
                <a href="/timeline" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'timeline' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-timeline-clock text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Zaman Çizelgesi</span>
                </a>
                
                <a href="/world" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'world' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-earth text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Dünya</span>
                </a>
                
                <a href="/export" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'export' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-download text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Dışa Aktar</span>
                </a>
                
                <a href="/search" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'search' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-magnify text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Arama</span>
                </a>
                
                <a href="/settings" 
                   class="nav-link flex items-center p-3 rounded-lg transition-all"
                   :class="currentPage === 'settings' ? 'bg-primary/20 text-primary' : 'text-gray-400 hover:bg-dark-700 hover:text-gray-100'">
                    <i class="mdi mdi-cog text-xl"></i>
                    <span class="ml-3 whitespace-nowrap" :class="sidebarCollapsed ? 'hidden' : 'inline'">Ayarlar</span>
                </a>
            </nav>
            
            <!-- Footer -->
            <div class="p-4 border-t border-dark-700 text-xs text-gray-500 text-center" 
                 :class="sidebarCollapsed ? 'hidden' : 'block'">
                Absolute Story Manager v4.0
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 overflow-y-auto bg-dark-900">
            <!-- Top Bar -->
            <header class="bg-dark-800/50 backdrop-blur-sm border-b border-dark-700 sticky top-0 z-10">
                <div class="flex items-center justify-between px-6 py-4">
                    <h2 class="text-2xl font-bold">{% block page_title %}Dashboard{% endblock %}</h2>
                    
                    <div class="flex items-center space-x-4">
                        <!-- Quick Actions -->
                        <button @click="showNewChapterModal = true" 
                                class="btn-primary px-4 py-2 rounded-lg gradient-primary text-white font-medium hover:opacity-90 transition-opacity flex items-center">
                            <i class="mdi mdi-plus mr-2"></i>
                            Yeni Bölüm
                        </button>
                        
                        <!-- Theme Toggle -->
                        <button @click="toggleTheme()" class="p-2 hover:bg-dark-700 rounded-lg transition-colors">
                            <i class="mdi" :class="darkMode ? 'mdi-white-balance-sunny' : 'mdi-moon-waning-crescent'"></i>
                        </button>
                    </div>
                </div>
            </header>
            
            <!-- Page Content -->
            <div class="p-6">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
    
    <!-- Toast Notifications -->
    <div class="fixed bottom-4 right-4 z-50 space-y-2">
        <template x-for="toast in toasts" :key="toast.id">
            <div x-show="toast.visible"
                 x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="opacity-0 translate-y-2"
                 x-transition:enter-end="opacity-100 translate-y-0"
                 x-transition:leave="transition ease-in duration-200"
                 x-transition:leave-start="opacity-100 translate-y-0"
                 x-transition:leave-end="opacity-0 translate-y-2"
                 class="px-4 py-3 rounded-lg shadow-lg flex items-center space-x-3 min-w-[300px]"
                 :class="{
                     'bg-green-600': toast.type === 'success',
                     'bg-red-600': toast.type === 'error',
                     'bg-blue-600': toast.type === 'info'
                 }">
                <i class="mdi" :class="{
                    'mdi-check-circle': toast.type === 'success',
                    'mdi-alert-circle': toast.type === 'error',
                    'mdi-information': toast.type === 'info'
                }"></i>
                <span x-text="toast.message"></span>
            </div>
        </template>
    </div>
    
    <script>
        function appData() {
            return {
                currentPage: '{{ request.endpoint }}'.split('.')[0] || 'dashboard',
                sidebarCollapsed: false,
                darkMode: true,
                showNewChapterModal: false,
                toasts: [],
                
                toggleSidebar() {
                    this.sidebarCollapsed = !this.sidebarCollapsed;
                },
                
                toggleTheme() {
                    this.darkMode = !this.darkMode;
                    document.documentElement.classList.toggle('dark');
                },
                
                showToast(message, type = 'info') {
                    const id = Date.now();
                    this.toasts.push({ id, message, type, visible: true });
                    setTimeout(() => {
                        const toast = this.toasts.find(t => t.id === id);
                        if (toast) toast.visible = false;
                        setTimeout(() => {
                            this.toasts = this.toasts.filter(t => t.id !== id);
                        }, 300);
                    }, 3000);
                }
            }
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
